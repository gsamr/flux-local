apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: artifactory-dev
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://github.com/gsamr/flux-local.git
  ref:
    branch: main
  ignore: |
    /*
    !/values.acc.yaml
    !/charts/
    /charts/*
    !/charts/acc/
    /charts/acc/*
    !/charts/acc/artifactory/